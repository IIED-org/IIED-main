encrypt.profile.*:
  type: config_entity
  label: 'Encrypt Profile'
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    encryption_method:
      type: string
      label: 'Encryption method selected for encryption profile'
      constraints:
        PluginExists:
          manager: plugin.manager.encrypt.encryption_methods
          interface: Drupal\encrypt\EncryptionMethodInterface
    encryption_method_configuration:
      type: encryption_method.config.[%parent.encryption_method]
      label: 'Encryption method configuration'
    encryption_key:
      type: string
      label: 'Key ID for encryption profile'
      constraints:
        ConfigExists:
          prefix: key.key.


encryption_method.config.*:
  type: sequence
  label: 'Encryption method config'
  sequence:
    type: string
